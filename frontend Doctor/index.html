<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwasthyaSetu AI — Doctor Clinical Portal</title>
    <!-- Google Fonts: Warm Clinic Typography (Newsreader / Epilogue & Noto Sans + Indic scripts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['"SF Mono"', 'JetBrains Mono', 'ui-monospace', 'monospace']
            },
            colors: {
              'apple-blue': '#007AFF',
              'apple-blue-hover': '#0062CC',
              'apple-green': '#34C759',
              'apple-green-deep': '#248A3D',
              'apple-indigo': '#5856D6',
              'apple-orange': '#FF9500',
              'apple-red': '#FF3B30',
              'apple-teal': '#30B0C7',
              'apple-gray-1': '#8E8E93',
              'apple-gray-2': '#AEAEB2',
              'apple-gray-3': '#C7C7CC',
              'apple-gray-4': '#D1D1D6',
              'apple-gray-5': '#E5E5EA',
              'apple-gray-6': '#F2F2F7',
              'apple-label': '#1C1C1E',
              'apple-secondary': '#636366',
              'apple-tertiary': '#8E8E93',
              'apple-card': '#FFFFFF',
              'apple-bg': '#F2F2F7',
              'apple-glass': 'rgba(255, 255, 255, 0.78)',
              'apple-glass-border': 'rgba(255, 255, 255, 0.65)',
            },
            boxShadow: {
              'apple-sm': '0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03)',
              'apple-md': '0 4px 14px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04)',
              'apple-lg': '0 12px 32px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.05)',
              'apple-glass': '0 8px 32px 0 rgba(0, 0, 0, 0.06)',
            }
          }
        }
      }
    </script>
    <style>
      .liquid-glass {
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      .liquid-glass-toolbar {
        background: rgba(248, 248, 250, 0.82);
        backdrop-filter: blur(30px) saturate(190%);
        -webkit-backdrop-filter: blur(30px) saturate(190%);
        border-bottom: 0.5px solid rgba(0, 0, 0, 0.12);
      }
      .liquid-glass-sidebar {
        background: rgba(245, 245, 247, 0.75);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border-right: 0.5px solid rgba(0, 0, 0, 0.1);
      }
      .liquid-glass-sheet {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(32px) saturate(190%);
        -webkit-backdrop-filter: blur(32px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.7);
      }
      .apple-segmented-item {
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
    </style>
  </head>
  <body class="bg-[#F2F2F7] text-[#1C1C1E] antialiased selection:bg-[#007AFF]/20 selection:text-[#007AFF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
